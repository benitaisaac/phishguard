[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishguard-ml"
version = "1.0.0"
description = "Explainable machine-learning phishing-URL detection, implemented from scratch in pure Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aashish Bharti" }]
keywords = ["phishing", "cybersecurity", "machine-learning", "url-classification", "explainable-ai", "mca-project"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aashishbharti04/phishguard"
Issues = "https://github.com/aashishbharti04/phishguard/issues"

[project.scripts]
phishguard = "phishguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
