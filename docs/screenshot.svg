<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#9d4eff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="#0d1117"/>
  <circle cx="120" cy="80" r="180" fill="#00e5ff" opacity="0.10"/>
  <circle cx="900" cy="560" r="170" fill="#ff2e97" opacity="0.10"/>

  <!-- nav -->
  <text x="40" y="52" fill="#e6edf3" font-size="22" font-weight="800">🛡️ Phish<tspan fill="#00e5ff">Guard</tspan></text>
  <text x="838" y="50" fill="#8b97a7" font-size="14" font-weight="600">GitHub</text>
  <rect x="912" y="32" width="40" height="40" rx="10" fill="#161b22" stroke="#283041"/>
  <text x="924" y="58" font-size="16">🌙</text>

  <!-- hero -->
  <rect x="370" y="100" width="260" height="26" rx="13" fill="#161b22" stroke="#283041"/>
  <text x="500" y="118" fill="#8b97a7" font-size="12" font-weight="600" text-anchor="middle">Explainable AI · 100% in-browser · Private</text>
  <text x="500" y="178" fill="#e6edf3" font-size="46" font-weight="900" text-anchor="middle">Is this link <tspan fill="url(#grad)">safe</tspan>?</text>

  <!-- input -->
  <rect x="230" y="210" width="400" height="52" rx="12" fill="#161b22" stroke="#283041"/>
  <text x="250" y="243" fill="#8b97a7" font-size="15">http://paypal.secure-login-update.tk/verify</text>
  <rect x="642" y="210" width="128" height="52" rx="12" fill="url(#btn)"/>
  <text x="706" y="243" fill="#06121a" font-size="16" font-weight="700" text-anchor="middle">Analyze</text>

  <!-- result card -->
  <rect x="230" y="296" width="540" height="268" rx="16" fill="#161b22" stroke="#283041"/>
  <text x="256" y="340" fill="#ff5470" font-size="26" font-weight="900">⚠ Phishing</text>
  <text x="744" y="338" fill="#8b97a7" font-size="13" font-weight="600" text-anchor="end" font-family="monospace">99.8% phishing · 100% confidence</text>
  <!-- gauge -->
  <rect x="256" y="356" width="488" height="14" rx="7" fill="#1c2230"/>
  <rect x="256" y="356" width="487" height="14" rx="7" fill="#ff5470"/>
  <text x="256" y="392" fill="#8b97a7" font-size="12.5" font-family="monospace">http://paypal.secure-login-update.tk/verify?account=1</text>
  <line x1="256" y1="408" x2="744" y2="408" stroke="#283041"/>
  <text x="256" y="432" fill="#e6edf3" font-size="15" font-weight="700">Why this verdict</text>

  <!-- explanation rows -->
  <g font-size="12.5" font-family="monospace">
    <rect x="256" y="446" width="92" height="20" rx="6" fill="#ff547026"/><text x="262" y="460" fill="#ff5470" font-weight="700">↑ phishing</text>
    <text x="360" y="460" fill="#e6edf3">suspicious_tld</text>
    <rect x="540" y="450" width="204" height="8" rx="4" fill="#1c2230"/><rect x="540" y="450" width="200" height="8" rx="4" fill="#ff5470"/>

    <rect x="256" y="474" width="92" height="20" rx="6" fill="#ff547026"/><text x="262" y="488" fill="#ff5470" font-weight="700">↑ phishing</text>
    <text x="360" y="488" fill="#e6edf3">has_suspicious_word</text>
    <rect x="540" y="478" width="204" height="8" rx="4" fill="#1c2230"/><rect x="540" y="478" width="150" height="8" rx="4" fill="#ff5470"/>

    <rect x="256" y="502" width="92" height="20" rx="6" fill="#ff547026"/><text x="262" y="516" fill="#ff5470" font-weight="700">↑ phishing</text>
    <text x="360" y="516" fill="#e6edf3">brand_in_subdomain</text>
    <rect x="540" y="506" width="204" height="8" rx="4" fill="#1c2230"/><rect x="540" y="506" width="110" height="8" rx="4" fill="#ff5470"/>

    <rect x="256" y="530" width="92" height="20" rx="6" fill="#00ffa326"/><text x="266" y="544" fill="#00ffa3" font-weight="700">↓ legit</text>
    <text x="360" y="544" fill="#e6edf3">uses_https</text>
    <rect x="540" y="534" width="204" height="8" rx="4" fill="#1c2230"/><rect x="540" y="534" width="90" height="8" rx="4" fill="#00ffa3"/>
  </g>
</svg>
